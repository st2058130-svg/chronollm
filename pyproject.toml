[project]
name = "sn38-chronollm"
version = "0.1.0"
description = "SN38 ChronoLLM Subnet"
requires-python = ">=3.11"
dependencies = [
    "bittensor>=8.0.0,<11.0.0",
    "torch>=2.0",
    "transformers>=4.48.0",
    "huggingface_hub>=1.23.0",
    "hf-xet>=1.5.2",
    "numpy>=1.0",
    "requests>=2.0",
    "tiktoken>=0.5.0",
    "openai>=1.0.0",
    "dstack-sdk>=0.1.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
train = [
    "datasets>=2.19.0",
    "accelerate>=0.33.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["sn38*"]
